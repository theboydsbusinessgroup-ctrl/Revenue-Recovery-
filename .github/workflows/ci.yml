name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test recovery engine
        run: |
          python -m unittest discover tests -v
          python scripts/run_sample.py > /tmp/recovery-sample.json
          python -m json.tool /tmp/recovery-sample.json > /dev/null
          python scripts/run_csv_sample.py > /tmp/recovery-csv-sample.json
          python -m json.tool /tmp/recovery-csv-sample.json > /dev/null
          python scripts/run_action_sample.py > /tmp/recovery-action-sample.json
          python -m json.tool /tmp/recovery-action-sample.json > /dev/null
